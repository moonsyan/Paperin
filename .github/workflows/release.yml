name: release

# 候选包先验收、再正式发行（R10 / plan §13）。
# 发布身份：GitHub moonsyan/Paperin（与 package.json build.publish / electron-updater 一致）；
# 本地 Git 可保留 origin=Gitee 推送镜像，候选 Draft 与正式发行仍只走 GitHub Actions 本仓库。
#
# 触发方式：
#   1. 推送 tag v*：仅产候选 artifact + GitHub Draft Release（不正式对外发布）
#   2. workflow_dispatch action=candidate：同上（tag 可留空则用 package.json version）
#   3. workflow_dispatch action=publish-formal：在候选 draft 已存在且 commit 一致时，
#      输入 confirm_publish=PUBLISH 与 candidate_sha 后，才将 draft 改为正式 Release
#
# 与 build.yml 的分工：build.yml 是三平台质量门禁（不产安装包）；
# 本文件负责出安装包；gate + smoke 只在候选链跑一次，避免三平台重复消耗。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      action:
        description: 'candidate=产候选 draft；publish-formal=在候选校验后正式发行'
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - publish-formal
      tag:
        description: '发布 tag（candidate 留空则用 package.json 的 version，例如 v0.6.0）'
        required: false
        default: ''
      candidate_sha:
        description: 'publish-formal 必填：必须与候选 Draft Release 指向的 commit 一致'
        required: false
        default: ''
      confirm_publish:
        description: 'publish-formal 必填：输入 PUBLISH 才允许正式发行'
        required: false
        default: ''

permissions:
  contents: write

# job 级 if 不能读取 env 上下文，否则 GitHub 在创建 job 前判定工作流无效。
# tag 推送也没有 inputs 上下文，条件统一读 github.event.inputs。

jobs:
  gate:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'candidate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci

  # Windows runner 有桌面会话，跑 Electron 冒烟作为候选包验收门禁
  candidate-acceptance:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'candidate') }}
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke

  build-win:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'candidate') }}
    needs: candidate-acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm run build 内含 typecheck
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: |
            release/*/Paperin-Setup-*.exe
            release/*/Paperin-Setup-*.exe.blockmap
            release/*/latest.yml
          if-no-files-found: error

  # P0-05 Windows 安装态验收（UNVERIFIED：脚本已具备，两隔离环境未实测；启用前勿去掉 if: false）
  installed-acceptance-win:
    if: false
    needs: build-win
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-win
          path: artifacts/win
      - name: Windows 安装/升级/卸载循环（隔离 runner + 显式确认）
        shell: pwsh
        run: |
          $base = Get-ChildItem -Path artifacts/win -Recurse -Filter 'Paperin-Setup-*.exe' |
            Sort-Object { [version]($_.BaseName -replace '^Paperin-Setup-','') } |
            Select-Object -First 1
          if (-not $base) { throw '未找到 Paperin-Setup 候选 exe' }
          node scripts/verify-windows-install.mjs `
            --confirm-isolated-environment `
            --from "release/0.6.0/Paperin-Setup-0.6.0.exe" `
            --to $base.FullName `
            --install-dir "$env:TEMP\paperin-installed-acceptance"

  build-mac:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'candidate') }}
    needs: candidate-acceptance
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: |
            release/*/*.dmg
            release/*/latest-mac.yml
          if-no-files-found: error

  build-linux:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'candidate') }}
    needs: candidate-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            release/*/*.AppImage
            release/*/latest-linux.yml
          if-no-files-found: error

  candidate-release:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'candidate') }}
    needs: [build-win, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解析候选 tag
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "候选 tag: $tag"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 列出候选产物
        run: ls -lh artifacts
      - name: 写入候选校验记录
        id: record
        shell: bash
        run: |
          set -euo pipefail
          record_file="artifacts/candidate-record.txt"
          {
            echo "Paperin candidate acceptance record"
            echo "候选 commit: ${{ github.sha }}"
            echo "支持平台: Windows candidate-acceptance（本 job）；macOS/Linux 安装 UNVERIFIED"
            echo "smoke 结果: npm run smoke (Windows candidate-acceptance job)"
            echo "安装/升级/卸载环境: UNVERIFIED"
            echo "用户文件保留: UNVERIFIED"
            echo "未验证项: installed-acceptance-win 仍为 if:false；verify-windows-install 脚本已就绪，两隔离环境未实测"
            echo "tag: ${{ steps.resolve.outputs.tag }}"
            echo "workflow_run: ${{ github.run_id }}"
          } > "$record_file"
          cat "$record_file"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: Paperin ${{ steps.resolve.outputs.tag }} (candidate)
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **候选包（Draft）— 非正式发行**

            - commit: `${{ github.sha }}`
            - workflow run: ${{ github.run_id }}
            - 候选验收：`npm run smoke`（Windows）

            正式发行须在同一 commit 上通过 `publish-formal` workflow，并填写 `candidate_sha=${{ github.sha }}` 与 `confirm_publish=PUBLISH`。
          files: |
            artifacts/**
            artifacts/candidate-record.txt

  publish-formal:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish-formal' && github.event.inputs.confirm_publish == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 解析正式发行 tag
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_TAG" ]; then
            echo "publish-formal 必须提供 tag 输入" >&2
            exit 1
          fi
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
      - name: 校验候选 draft 与 commit 门禁
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ -z "$CANDIDATE_SHA" ]; then
            echo "candidate_sha 必填，必须与候选 Draft Release 的 commit 一致" >&2
            exit 1
          fi
          if ! gh release view "$TAG" --json isDraft,targetCommitish -q '.isDraft' | grep -qx true; then
            echo "tag $TAG 不存在 Draft Release，或已是正式发布；请先跑候选链" >&2
            exit 1
          fi
          release_commit="$(gh release view "$TAG" --json targetCommitish -q '.targetCommitish')"
          if [ "$release_commit" != "$CANDIDATE_SHA" ]; then
            echo "candidate_sha ($CANDIDATE_SHA) 与 Draft Release commit ($release_commit) 不一致" >&2
            exit 1
          fi
          if ! git cat-file -e "${CANDIDATE_SHA}^{commit}" 2>/dev/null; then
            echo "candidate_sha 不是有效 commit" >&2
            exit 1
          fi
          echo "候选门禁通过：tag=$TAG commit=$CANDIDATE_SHA"
      - name: 将 Draft 提升为正式 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --draft=false \
            --title "Paperin ${TAG#v}" \
            --notes "Formal release promoted from candidate draft at commit \`${CANDIDATE_SHA}\` (confirm_publish=PUBLISH)."
